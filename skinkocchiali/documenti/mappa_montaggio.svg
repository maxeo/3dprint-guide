<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650"><rect width="600" height="650" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#35272e"><text x="30" y="35" font-size="18" font-weight="700">Mappa di montaggio · vista frontale</text><text x="30" y="61" font-size="12" fill="#796b70">Schema indicativo. Quote reali e pezzi nella guida 3D.</text><text x="48" y="104" font-size="13" font-weight="700">← SUD / SINISTRA</text><text x="376" y="104" font-size="13" font-weight="700">NORD / DESTRA →</text><rect x="140" y="135" width="360" height="365" rx="4" fill="#edf0f3" stroke="#81919c" stroke-width="5"/><path d="M140 161V500" stroke="#edf0f3" stroke-width="7"/><text x="146" y="492" font-size="10" fill="#796b70">Sud aperto</text><rect x="150" y="440" width="22" height="40" fill="#8fa8e6" stroke="#5b7fd6"/><text x="146" y="432" font-size="11">P08</text><rect x="172" y="174" width="15" height="306" fill="#f7bd82" stroke="#b38145"/><path d="M180 181L200 159" stroke="#b38145"/><text x="196" y="152" font-size="12">P02</text><rect x="190" y="174" width="150" height="306" fill="#c6acd9" stroke="#826ba4"/><text x="290" y="205" font-size="15" font-weight="700">P03</text><rect x="347" y="174" width="128" height="306" fill="#b8cbe4" stroke="#728daa"/><text x="365" y="205" font-size="13">Sezioni fisse</text><rect x="140" y="137" width="360" height="24" fill="#81919c"/><text x="399" y="153" fill="#fff" font-size="12">P01 · grata</text><rect x="222" y="273" width="229" height="213" fill="#d39bab" stroke="#963f62" stroke-width="2"/><text x="240" y="300" font-size="14" font-weight="700">P04 · corpo pieno</text><path d="M331 476V427" stroke="#e5b258" stroke-width="8"/><rect x="321" y="419" width="29" height="13" rx="2" fill="#e5b258"/><path d="M363 385V345m-7 8l7-8 7 8" fill="none" stroke="#963f62" stroke-width="2"/><text x="372" y="369" font-size="12">25 mm</text><text x="240" y="409" font-size="12">P05</text><path d="M270 405L325 444" fill="none" stroke="#963f62"/><rect x="60" y="500" width="428" height="28" rx="3" fill="#81bcb3" stroke="#427e74" stroke-width="2"/><path d="M242 503L257 474Q262 464 267 474L282 503Z" fill="#60958c"/><path d="M188 506h6v-4h6v8h-6v4h-6z M398 506h6v-4h6v8h-6v4h-6z" fill="#eedfbd" stroke="#8a7a52"/><text x="73" y="519" font-size="13" font-weight="700">P06 · portaocchiali</text><text x="30" y="575" font-size="13">1 · Inserisci P02, P03 e P08 nella base; appoggia P06, metti le 2 chiavi P07 e abbassa P01.</text><text x="30" y="599" font-size="13">2 · Infila P05 dall’alto in P04, poi appoggia i patch.</text><text x="30" y="623" font-size="13">3 · Inserisci il piede di P04 nella tasca di P01.</text></g></svg>