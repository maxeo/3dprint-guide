const DATA=OrganizerCfg.patch({"root":"..","title":"Organizer modulare · guida del prototipo","theme":{"accent":"#557e6b","viewer_bg":"#25332e"},"header":{"eyebrow":"Organizer modulare · incastri e presa integrata","h1":"Un modulo, tre livelli configurabili.","intro_html":"<b>I traversi si agganciano ai montanti con un tenone a L:</b> entrano sollevati e scendono di 1,5 mm. Longherone basso, guida e fermo sono un pezzo unico per lato. Il cassetto ha una presa cava a mezza C, continua con il frontale e aperta verso l’interno. Questa guida mostra un modulo standard da ripetere tre volte. Per misure diverse usa il pulsante <a href=\"#configura\">Configura</a>: l’anteprima si rigenera con le tue misure.","facts":[{"value":"250 × 240 mm","label":"impronta esterna"},{"value":"106 mm","label":"passo per livello"},{"value":"9 + 9","label":"sedi per lato"},{"value":"12 STL","label":"pezzi del modulo"}]},"camera":{"yaw":-0.66,"pitch":0.55},"caption":"Un modulo visto dall’alto: ruota, esplodi e seleziona i pezzi. Il frontale aperto è il lato da cui scorre il cassetto.","model_note_html":"<span class=\"badge\">Prototipo da verificare</span><p>Tenoni dei traversi 6 × 5 × 8 mm con dente a L di 1,5 mm e gioco nominale 0,35 mm per lato. Guida e fermo sono stampati insieme al longherone basso. La presa curva sporge circa 15 mm e apre una tasca per le dita verso l’interno del cassetto. Stampa un provino per verificare giochi e portata.</p>","groups":{"Telaio":{"color":"#d5c8ab"},"Guide":{"color":"#4d5559"},"Cassetto":{"color":"#638c78"},"Divisori":{"color":"#b97058"}},"steps_section":{"eyebrow":"01 / Montaggio geometrico","h2":"Assembla un modulo, poi ripeti.","intro_html":"Le posizioni sono ricavate dagli STL. I giunti sono modellati ma i giochi e il comportamento sotto carico vanno provati fisicamente.","start_html":"<h3>Prima della stampa</h3><p>Controlla il volume del piatto: ogni pezzo entra in un piatto 230 × 230 mm: cassetto 205 × 225 mm compresa la presa, traverse 222 mm, lon \"#5a5143\" stroke-width=\"2\"/><path d=\"M296 55 V63\" stroke=\"#b97058\" stroke-width=\"2\"/><text x=\"300\" y=\"62\" font-size=\"12\" fill=\"#26312c\">luce 1,5</text><path d=\"M258 104 H285\" stroke=\"#26312c\" stroke-width=\"1.5\"/><text x=\"232\" y=\"116\" font-size=\"12\" fill=\"#26312c\">dente 3 × 1,5</text><text x=\"40\" y=\"118\" font-size=\"13\" fill=\"#26312c\">traverso</text><text x=\"240\" y=\"134\" font-size=\"13\" fill=\"#26312c\">montante</text></svg>"},{"title":"Piano di stampa","html":"<p>Lo standard è dimensionato per un piatto <b>230 × 230 mm</b>, il più comune: cassetto 205 × 224,9 mm con la presa, traverse posteriori 222 mm, longheroni 212 mm, montanti 22 × 22 × 112 mm in piedi. Se aumenti le misure, il pannello segnala i pezzi che non entrano più; ridimensiona dal <a href=\"#configura\">configuratore</a> o progetta una divisione dei pezzi.</p>"},{"title":"Presa cava a mezza C","html":"<p>Il lato interno della presa resta allineato al cassetto; il guscio esterno si curva fino a circa 15 mm al centro e sfuma ai lati. La tasca è aperta in alto e passa attraverso la parete frontale verso l’interno, per infilare le dita. Il guscio resta unito al cassetto sotto e ai lati.</p><svg viewBox=\"0 0 360 110\" role=\"img\" aria-label=\"Sezione dall’alto della presa cava\"><path d=\"M35 55 H145 M215 55 H325\" stroke=\"#26312c\" stroke-width=\"8\"/><path d=\"M145 55 Q180 110 215 55 L207 55 Q180 91 153 55 Z\" fill=\"#638c78\" stroke=\"#365746\" stroke-width=\"2\"/><text x=\"20\" y=\"28\" font-size=\"13\" fill=\"#26312c\">interno del cassetto</text><text x=\"245\" y=\"91\" font-size=\"13\" fill=\"#26312c\">curva esterna</text></svg>"}]},"files":{"h2":"File del progetto.","intro_html":"La guida funziona offline. Il pulsante Configura genera STL e anteprima nel browser; Blender conserva il modello modificabile.","links":[{"label":"Configura (STL senza Blender)","href":"#configura"},{"label":"File Blender","href":"Organizer_Modulare_Parametrico.blend"},{"label":"  {id:'system',nome:'Sistema',icona:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'},

 b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t.icona}</svg>${t.nome}`;
 b.setAttribute('aria-label',`Tema ${t.nome.toLowerCase()}. Passa a ${d.nome.toLowerCase()}`)};

<!--STAMPANTE-INIZIO--><script>(()=>{
"use strict";
const KEY='stampante-guide',DEF={x:230,y:230,z:250};
const MODELLI=[['Comune 230 × 230',230,230,250],['Creality Ender-3',220,220,250],['Prusa MK4',250,210,220],['Bambu Lab A1 / P1S / X1',256,256,256],['Bambu Lab A1 mini',180,180,180]];
const PERM=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
const fmt=v=>Number(v).toLocaleString('it-IT',{maximumFractionDigits:1});
const cbs=[];
function get(){try{const b=JSON.parse(localStorage.getItem(KEY)||'null');if(b&&['x','y','z'].every(k=>b[k]>0))return b}catch(_){}return {...DEF}}
function set(b){try{localStorage.setItem(KEY,JSON.stringify(b))}catch(_){}update()}
// Un pezzo entra se esiste un'orientazione a 90° con ogni misura entro l'area.
function fits(d,b=get()){const B=[b.x,b.y,b.z];return PERM.some(o=>o.every((a,k)=>d[a]<=B[k]+1e-6))}
// dims dai builder attuali, dimensions_mm dalle guide generate da uno spec Blender (Supporto per Tablet)
const parti=()=>typeof DATA!=='undefined'&&DATA&&Array.isArray(DATA.parts)?DATA.parts.filter(p=>!p.ghost).map(p=>({...p,dims:p.dims||p.dimensions_mm})).filter(p=>Array.isArray(p.dims)):[];
const testo=b=>`${fmt(b.x)} × ${fmt(b.y)} × ${fmt(b.z)} mm`;
let top,btn,pop,avviso;
function check(){const b=get(),fuori=parti().filter(p=>!fits(p.dims,b));
  if(btn){btn.querySelector('b').textContent=`${fmt(b.x)} × ${fmt(b.y)}`;btn.classList.toggle('fuori',fuori.length>0);
    btn.title=fuori.length?`Area di stampa ${testo(b)}: ${fuori.length} pezzi non entrano`:`Area di stampa ${testo(b)}`;
    const e=pop.querySelector('.stampante-esito');e.textContent=fuori.length?`Non entrano: ${fuori.map(p=>p.id).join(', ')}.`:(parti().length?'Tutti i pezzi entrano.':'');e.classList.toggle('fuori',fuori.length>0)}
  if(avviso){avviso.hidden=!fuori.length;avviso.innerHTML=fuori.length?`<b>Attenzione: ${fuori.length===1?'un pezzo non entra':fuori.length+' pezzi non entrano'} nell’area di stampa ${testo(b)}.</b> ${fuori.map(p=>`${p.id}${p.label&&p.label!==p.id?' '+p.label:''} (${p.dims.map(fmt).join(' × ')} mm)`).join(', ')}. Scala o dividi questi pezzi, oppure imposta la tua stampante con il pulsante <i>Stampante</i> in alto.`:''}
  const ids=new Set(fuori.map(p=>p.id));
  document.querySelectorAll('tr[data-id]').forEach(tr=>{const f=ids.has(tr.dataset.id);tr.classList.toggle('stampante-fuori',f);let t=tr.querySelector('.stampante-tag');
    if(f&&!t){t=document.createElement('span');t.className='stampante-tag';t.textContent='non entra';(tr.children[1]||tr.children[0]).appendChild(t)}else if(!f&&t)t.remove()});
  return fuori}
function update(){check();for(const cb of cbs)try{cb(get())}catch(e){console.error(e)}}
function monta(){
  top=document.querySelector('.guida-top');if(!top){top=document.createElement('div');top.className='guida-top';document.body.appendChild(top)}
  const w=document.createElement('div');w.className='stampante-wrap';
  w.innerHTML=`<button type="button" class="stampante-btn" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 21h10M9 17v4M15 17v4"/></svg>Stampante <b></b><i></i></button><div class="stampante-pop" hidden><b>Area di stampa</b><p>Dimensioni massime della tua stampante, in mm. Vale per tutte le guide: serve a segnalare i pezzi che non entrano.</p><div class="stampante-xyz">${['x','y','z'].map(k=>`<label><span>${k.toUpperCase()}</span><input data-k="${k}" type="number" min="50" max="2000" step="1" inputmode="numeric"></label>`).join('')}</div><select aria-label="Stampanti comuni"><option value="">Stampanti comuni…</option>${MODELLI.map((m,i)=>`<option value="${i}">${m[0]} · ${m[1]} × ${m[2]} × ${m[3]}</option>`).join('')}</select><p class="stampante-esito"></p></div>`;
  top.insertBefore(w,top.firstChild);btn=w.querySelector('button');pop=w.querySelector('.stampante-pop');
  const inputs=[...pop.querySelectorAll('input')],carica=()=>{const b=get();inputs.forEach(i=>i.value=b[i.dataset.k])};carica();
  inputs.forEach(i=>i.addEventListener('input',()=>{const v=Number(i.value);if(v>0)set({...get(),[i.dataset.k]:v})}));
  pop.querySelector('select').addEventListener('change',e=>{const m=MODELLI[e.target.value];if(!m)return;set({x:m[1],y:m[2],z:m[3]});carica();e.target.value=''});
  const mostra=on=>{pop.hidden=!on;btn.setAttribute('aria-expanded',on)};
  btn.addEventListener('click',e=>{e.stopPropagation();mostra(pop.hidden)});
  document.addEventListener('click',e=>{if(!pop.hidden&&!w.contains(e.target))mostra(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden){mostra(false);btn.focus()}});
  // il pulsante del tema (tema.py) va nello stesso contenitore, dopo questo
  const sposta=()=>{const t=document.querySelector('.tema-guida');if(t&&t.parentNode!==top)top.appendChild(t)};sposta();
  new MutationObserver(sposta).observe(document.body,{childList:true});
  const main=document.querySelector('main');avviso=document.createElement('p');avviso.className='warning stampante-avviso';avviso.hidden=true;avviso.setAttribute('role','status');
  if(main)main.insertBefore(avviso,main.firstChild);
  addEventListener('storage',e=>{if(e.key===KEY){carica();update()}});
  check()}
window.StampanteGuide={get,set,fits,check,onChange:cb=>cbs.push(cb)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',monta);else monta();
})();</script><!--STAMPANTE-FINE-->
