<text x="620" y="536" font-size="17">Posizione di un perno</text>
<text x="560" y="589" font-size="20" font-weight="700">Perno Ø3,42 × 15 mm</text>
<text x="560" y="620" font-size="17">STL a sé · stampa 21 copie</text>
<text x="560" y="666" font-size="17">Sedi Ø3,4 × 7,5 mm per lato</text>
<text x="60" y="799" font-size="21" font-weight="700">Un modulo per file · scala 100% · millimetri</text>
<text x="60" y="832" font-size="17">Ogni modulo è entro 210 × 210 mm. Rinforzi e sedi sono integrati.</text>
<text x="60" y="863" font-size="17">La mappa è schematica: le sagome floreali sono presenti negli STL.</text>
