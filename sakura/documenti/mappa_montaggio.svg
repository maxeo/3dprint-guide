<text x="135" y="723" font-size="16" font-weight="700">BASSO</text>
<text x="560" y="215" font-size="23" font-weight="700">Ordine di montaggio</text>
<text x="560" y="258" font-size="18">1. Unisci le tre coppie:</text>
<text x="580" y="290" font-size="18">P01 + P02 · 3 perni</text>
<text x="580" y="320" font-size="18">P03 + P04 · 3 perni</text>
<text x="580" y="350" font-size="18">P05 + P06 · 3 perni</text>
<text x="560" y="405" font-size="18">2. Unisci le righe:</text>
<text x="580" y="437" font-size="18">inferiore + centrale · 6 perni</text>
<text x="580" y="467" font-size="18">aggiungi la superiore · 6 perni</text>
